---
- name: Write sources file
  notify:
    - Update apt
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: "{{ hetzner_baseurl }}"
      Suites: "{{ hetzner_suites | join(' ') }}"
      Components: "{{ hetzner_components | join(' ') }}"
    dest: "/etc/apt/sources.list.d/{{ hetzner_filename }}.sources"
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  tags:
    - hetzner

...
